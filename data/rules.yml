version: "3.1"

rules:

- rule: Greet rule
  steps:
  - intent: greet
  - action: utter_greet

- rule: Courses rule
  steps:
  - intent: ask_courses
  - action: utter_ask_courses

- rule: Admission rule
  steps:
  - intent: ask_admission
  - action: utter_ask_admission

- rule: Fees rule
  steps:
  - intent: ask_fees
  - action: utter_ask_fees

- rule: Goodbye rule
  steps:
  - intent: goodbye
  - action: utter_goodbye

- rule: Out of scope rule
  steps:
  - intent: out_of_scope
  - action: utter_out_of_scope

- rule: Fallback rule
  steps:
  - intent: nlu_fallback
  - action: utter_out_of_scope