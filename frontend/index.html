
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>University Admission Bot</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root {
    --primary: #6366f1;
    --primary-dark: #4f46e5;
    --bg-gradient: linear-gradient(135deg, #667eea, #764ba2);
    --chat-bg: rgba(255,255,255,0.75);
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
    font-family:'Inter',sans-serif;
    background:var(--bg-gradient);
    background-size:400% 400%;
    animation:gradientMove 12s ease infinite;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

@keyframes gradientMove {
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

#chat-container {
    width:100%;
    max-width:430px;
    height:620px;
    backdrop-filter:blur(20px);
    background:var(--chat-bg);
    border-radius:28px;
    box-shadow:0 25px 60px rgba(0,0,0,0.2);
    display:flex;
    flex-direction:column;
    overflow:hidden;
    animation:float 6s ease-in-out infinite;
}

@keyframes float {
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-8px);}
}

.chat-header {
    padding:20px;
    display:flex;
    align-items:center;
    border-bottom:1px solid rgba(0,0,0,0.05);
}

.bot-avatar {
    width:48px;
    height:48px;
    border-radius:50%;
    background:linear-gradient(135deg,#6366f1,#4f46e5);
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:22px;
    color:white;
    margin-right:12px;
    box-shadow:0 8px 20px rgba(79,70,229,0.4);
}

.header-info h3 {
    font-size:1rem;
    font-weight:600;
}

.header-info p {
    font-size:0.8rem;
    color:#10b981;
}

#messages {
    flex:1;
    padding:20px;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    gap:18px;
}

.message {
    max-width:75%;
    padding:14px 18px;
    border-radius:20px;
    font-size:0.95rem;
    animation:fadeIn 0.25s ease;
    position:relative;
    word-wrap:break-word;
}

@keyframes fadeIn {
    from{opacity:0;transform:translateY(10px);}
    to{opacity:1;transform:translateY(0);}
}

.user-message {
    align-self:flex-end;
    background:linear-gradient(135deg,#6366f1,#4f46e5);
    color:white;
    border-bottom-right-radius:5px;
}

.bot-message {
    align-self:flex-start;
    background:white;
    border:1px solid #e5e7eb;
    border-bottom-left-radius:5px;
}

.timestamp {
    font-size:10px;
    opacity:0.6;
    margin-top:6px;
    text-align:right;
}

.input-area {
    padding:18px;
    display:flex;
    gap:10px;
    background:rgba(255,255,255,0.9);
}

#userInput {
    flex:1;
    padding:14px 18px;
    border-radius:30px;
    border:1px solid #e5e7eb;
    outline:none;
    transition:0.3s;
}

#userInput:focus {
    border-color:#6366f1;
    box-shadow:0 0 0 4px rgba(99,102,241,0.15);
}

.send-btn {
    width:50px;
    height:50px;
    border-radius:50%;
    border:none;
    background:linear-gradient(135deg,#6366f1,#4f46e5);
    color:white;
    cursor:pointer;
    transition:0.3s;
    display:flex;
    justify-content:center;
    align-items:center;
}

.send-btn:hover {
    transform:scale(1.08);
    box-shadow:0 10px 25px rgba(79,70,229,0.4);
}

.typing-indicator {
    align-self:flex-start;
    background:white;
    padding:12px 18px;
    border-radius:20px;
    display:none;
}

.typing-indicator span {
    display:inline-block;
    width:6px;
    height:6px;
    background:#999;
    border-radius:50%;
    margin:0 2px;
    animation:bounce 1.4s infinite both;
}

.typing-indicator span:nth-child(1){animation-delay:-0.32s;}
.typing-indicator span:nth-child(2){animation-delay:-0.16s;}

@keyframes bounce {
    0%,80%,100%{transform:scale(0);}
    40%{transform:scale(1);}
}
</style>
</head>

<body>

<div id="chat-container">
    <div class="chat-header">
        <div class="bot-avatar">🎓</div>
        <div class="header-info">
            <h3>University Assistant</h3>
            <p>Online</p>
        </div>
    </div>

    <div id="messages">
        <div class="message bot-message">
            Hello! I'm your University Admission Bot. How can I help you today?
        </div>
    </div>

    <div class="typing-indicator" id="typingIndicator">
        <span></span><span></span><span></span>
    </div>

    <div class="input-area">
        <input type="text" id="userInput" placeholder="Type your message..." onkeypress="handleKeyPress(event)">
        <button class="send-btn" onclick="sendMessage()">
            ➤
        </button>
    </div>
</div>

<script>
const inputField = document.getElementById("userInput");
const messagesDiv = document.getElementById("messages");
const typingIndicator = document.getElementById("typingIndicator");

function handleKeyPress(event) {
    if (event.key === "Enter") sendMessage();
}

function scrollToBottom() {
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
}

function getTime() {
    return new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
}

async function sendMessage() {
    const message = inputField.value.trim();
    if (!message) return;

    const userHTML = `
        <div class="message user-message">
            ${escapeHtml(message)}
            <div class="timestamp">${getTime()}</div>
        </div>`;
    messagesDiv.insertAdjacentHTML("beforeend", userHTML);

    inputField.value="";
    scrollToBottom();

    messagesDiv.appendChild(typingIndicator);
    typingIndicator.style.display="block";
    scrollToBottom();

    try {
        const response = await fetch("http://localhost:5005/webhooks/rest/webhook", {
            method:"POST",
            headers:{ "Content-Type":"application/json" },
            body:JSON.stringify({ sender:"user", message:message })
        });

        const data = await response.json();
        typingIndicator.style.display="none";

        if(data && data.length>0){
            data.forEach(botMsg=>{
                const botHTML = `
                <div class="message bot-message">
                    ${escapeHtml(botMsg.text)}
                    <div class="timestamp">${getTime()}</div>
                </div>`;
                messagesDiv.insertAdjacentHTML("beforeend", botHTML);
            });
        } else {
            messagesDiv.insertAdjacentHTML("beforeend",
            `<div class="message bot-message">
                I didn't understand that.
                <div class="timestamp">${getTime()}</div>
            </div>`);
        }
    }
    catch(error){
        typingIndicator.style.display="none";
        messagesDiv.insertAdjacentHTML("beforeend",
        `<div class="message bot-message" style="color:red;">
            Cannot connect to Rasa server.
        </div>`);
    }

    scrollToBottom();
}

function escapeHtml(text){
    return text
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}
</script>

</body>
</html>
